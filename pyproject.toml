[project]
name = "pytopaint-pyside"
version = "0.4.0"
description = "Cluster analysis software for flow cytometry data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anndata>=0.12.18",
    "flowio>=1.4.0",
    "flowutils>=1.2.2",
    "geopandas>=1.1.3",
    "polars>=1.42.1",
    "pyarrow>=24.0.0",
    "pyside6>=6.11.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.12",
]


[tool.ruff.format]
quote-style = "single"

[tool.basedpyright]
typeCheckingMode = "off"
allowedUntypedLibraries = ["anndata", "flowutils", "flowio"]
useLibraryCodeForTypes = true
reportUnusedCallResult = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportCallIssue = false

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas-stubs>=3.0.5.260730",
    "pyinstaller>=6.20.0",
    "pyside6-stubs>=6.7.3.0",
    "pytest>=9.0.3",
    "snakeviz>=2.2.2",
]
